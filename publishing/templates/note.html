<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style-notes.css">
  <link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="note-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="/"><span class="site-brand-main">GENAI-RON</span><span class="site-brand-sub">🧠生成AI論🥦</span></a>
      <nav class="site-nav" aria-label="サイト内ナビゲーション"><a href="/article/">論考一覧</a><a href="/notes/">研究ノート</a><a href="/series/genai-shikumi/">生成AIのしくみ</a></nav>
    </div>
  </header>

  <main>
    <section class="note-hero">
      <p class="note-kicker">{{kicker}}</p>
      <h1>{{title}}</h1>
      <p class="note-lead"><strong>{{lead}}</strong></p>
      <p class="note-sublead">{{sublead}}</p>
      <p class="note-meta">{{note_meta}}</p>
    </section>

    <div class="note-layout">
      <aside class="note-sidebar" aria-label="ページ内目次">
        <p class="note-sidebar-title">CONTENTS</p>
{{sidebar_links}}
      </aside>

      <article class="note-content">
{{article_html}}
      </article>
    </div>
  </main>

  <footer class="site-footer"><p>GENAI-RON｜🧠生成AI論🥦</p></footer>
  <script src="/assets/theme.js" defer></script>
</body>
</html>
