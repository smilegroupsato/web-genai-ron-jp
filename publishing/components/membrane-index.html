    <div class="series-main membrane-index-main">
    <article class="note-box membrane-index-layout">
      <section
        class="series-hero membrane-index-hero"
        data-hero-variant="{{hero_variant}}"
        data-text-contrast="{{text_contrast}}"
        data-asset-role="{{asset_role}}"
        data-asset-ref="{{asset_ref}}"
        data-asset-status="{{asset_status}}"
      >
        <div class="membrane-index-title">
          <p class="series-kicker">{{series_kicker}}</p>
          <h1><span class="membrane-title-ja">膜</span><span class="membrane-title-en">MEMBRANE</span></h1>
          <p class="series-subtitle">{{subtitle}}</p>
        </div>
        <div class="membrane-index-regions" aria-hidden="true">
          <span class="membrane-region-a">region A</span>
          <span class="membrane-boundary-label">membrane</span>
          <span class="membrane-region-b">region B</span>
        </div>
        <div class="membrane-index-introduction">
{{introduction_html}}
        </div>
        <nav class="membrane-index-primary-nav" aria-label="MEMBRANE主要領域">
          <span><b>01</b> THOUGHTS <small>思索</small></span>
          <span><b>02</b> RESEARCH MAP <small>研究地図</small></span>
          <span><b>03</b> READING <small>読書ノート</small></span>
        </nav>
      </section>
      <aside class="membrane-index-information" aria-label="Information">
        <strong>INFORMATION</strong>
        <span>{{description}}</span>
      </aside>
      <div class="membrane-index-grid">
        <section class="membrane-index-thoughts">
{{thoughts_html}}
        </section>
        <section class="membrane-index-research-map">
{{research_map_html}}
        </section>
        <section class="membrane-index-reading">
{{reading_html}}
        </section>
      </div>
      <section class="membrane-index-bibliography">
{{bibliography_html}}
      </section>
      <section class="membrane-index-about">
{{about_html}}
      </section>
{{article_nav}}
    </article>
    </div>
