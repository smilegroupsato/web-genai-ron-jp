name: Validate Notes Publish

on:
  pull_request:
    paths:
      - ".gitignore"
      - "content/notes/**"
      - "site/notes/**"
      - "publishing/templates/note.html"
      - "publishing/NOTES_PUBLICATION.md"
      - "requirements-publishing.txt"
      - "scripts/build_notes_preview.py"
      - "scripts/promote_note.py"
      - "scripts/validate_notes_publish.py"
      - "scripts/validate_notes_visual.js"
      - ".github/workflows/validate-notes-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated publishing dependencies
        run: python -m pip install -r requirements-publishing.txt

      - name: Compile notes publishing tools
        run: |
          python -m py_compile \
            scripts/build_notes_preview.py \
            scripts/promote_note.py \
            scripts/validate_notes_publish.py

      - name: Validate approved themes link resolution
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import build_notes_preview
          from build_content_pages import BuildError
          from build_notes_preview import THEME_CANDIDATES, validate_theme_links
          from validate_notes_publish import validate_semantic_parity

          placeholders = [(title, description, "#") for title, description, _ in THEME_CANDIDATES]
          resolved = list(THEME_CANDIDATES)
          validate_theme_links(placeholders)
          validate_theme_links(resolved)

          rejected = [
              resolved[1],
              resolved[0],
              *resolved[2:],
          ]
          try:
              validate_theme_links(rejected)
          except BuildError:
              pass
          else:
              raise SystemExit("themes candidate reordering was not rejected")

          wrong_route = resolved.copy()
          title, description, _ = wrong_route[0]
          wrong_route[0] = (title, description, "/article/")
          try:
              validate_theme_links(wrong_route)
          except BuildError:
              pass
          else:
              raise SystemExit("unapproved themes route was not rejected")

          original_site_root = build_notes_preview.SITE_ROOT
          with tempfile.TemporaryDirectory() as empty_site:
              build_notes_preview.SITE_ROOT = Path(empty_site)
              try:
                  validate_theme_links(resolved)
              except BuildError:
                  pass
              else:
                  raise SystemExit("missing themes route target was not rejected")
              finally:
                  build_notes_preview.SITE_ROOT = original_site_root

          public_html = Path("site/notes/themes.html").read_text(encoding="utf-8")
          placeholder_html = public_html
          for _, _, href in THEME_CANDIDATES:
              placeholder_html = placeholder_html.replace(f'href="{href}"', 'href="#"', 1)
          with tempfile.TemporaryDirectory() as output_dir:
              current = Path(output_dir) / "themes-placeholder.html"
              current.write_text(placeholder_html, encoding="utf-8")
              resolved_html = placeholder_html
              for _, _, href in THEME_CANDIDATES:
                  resolved_html = resolved_html.replace('href="#"', f'href="{href}"', 1)
              candidate = Path(output_dir) / "themes.html"
              candidate.write_text(resolved_html, encoding="utf-8")
              validate_semantic_parity(
                  current,
                  candidate,
                  allow_themes_link_resolution=True,
              )
              try:
                  validate_semantic_parity(current, candidate)
              except BuildError:
                  pass
              else:
                  raise SystemExit("unapproved semantic link change was not rejected")

          legacy_hero = (
              '<p class="note-kicker">NEXT THEMES</p>\n'
              '      <h1>次テーマ候補</h1>\n'
              '      <p class="note-lead">主論考から派生して、今後展開していく予定のテーマ群。</p>'
          )
          current_hero = (
              '<p class="note-kicker">RELATED THEMES</p>\n'
              '      <h1>関連テーマ</h1>\n'
              '      <p class="note-lead">主論考から派生した関連テーマと、それぞれの論考への入口。</p>'
          )
          with tempfile.TemporaryDirectory() as output_dir:
              legacy = Path(output_dir) / "themes-legacy.html"
              renamed = Path(output_dir) / "themes-related.html"
              legacy.write_text(public_html.replace(current_hero, legacy_hero), encoding="utf-8")
              renamed.write_text(public_html.replace(legacy_hero, current_hero), encoding="utf-8")
              validate_semantic_parity(legacy, renamed, allow_themes_rename=True)
              try:
                  validate_semantic_parity(legacy, renamed)
              except BuildError:
                  pass
              else:
                  raise SystemExit("unapproved themes hero rename was not rejected")
          PY

      - name: Confirm notes builder cannot write to site
        run: |
          if python scripts/build_notes_preview.py --help | grep -q -- '--write-site'; then
            echo "notes preview builder unexpectedly exposes --write-site" >&2
            exit 1
          fi

      - name: Prove explicit write confirmation is required
        run: |
          before=$(git status --short -- site/)
          if python scripts/promote_note.py \
            --source content/notes/tool-discovery-layer/index.md \
            --candidate-root _notes_write_refusal_candidate; then
            echo "note promotion unexpectedly succeeded without --write-site" >&2
            exit 1
          fi
          after=$(git status --short -- site/)
          test "$before" = "$after"

      - name: Validate gate scope
        run: |
          python scripts/validate_notes_publish.py \
            --base-ref origin/main \
            --preview-root _notes_publish_preview

      - name: Validate source-to-candidate semantic parity
        run: |
          python scripts/validate_notes_publish.py \
            --source-check content/notes/tool-discovery-layer/index.md \
            --preview-root _notes_source_check_preview

      - name: Validate anchorless history overview parity
        run: |
          python scripts/validate_notes_publish.py \
            --source-check content/notes/history-of-generative-ai/index.md \
            --preview-root _notes_history_check

      - name: Validate history timeline parity
        run: |
          python scripts/validate_notes_publish.py \
            --source-check content/notes/history-of-generative-ai/timeline.md \
            --preview-root _notes_history_timeline_check

      - name: Validate notes collection index parity
        run: |
          python scripts/validate_notes_publish.py \
            --source-check content/notes/index.md \
            --preview-root _notes_collection_index_check

      - name: Validate flat themes page parity
        run: |
          python scripts/validate_notes_publish.py \
            --source-check content/notes/themes.md \
            --preview-root _notes_themes_check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated visual QA dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Resolve visual QA route
        id: visual-route
        run: |
          target=$(git diff --name-only origin/main...HEAD | \
            sed -nE 's#^site(/notes/(index\.html|themes\.html|[a-z0-9][a-z0-9-]*/(index|timeline)\.html))$#\1#p' | \
            head -n 1)
          if [ -n "$target" ]; then
            if [[ "$target" == */index.html ]]; then
              route="${target%index.html}"
            else
              route="$target"
            fi
          else
            route="/notes/tool-discovery-layer/"
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"

      - name: Start promoted-note preview server
        env:
          NOTES_PREVIEW_ROUTE: ${{ steps.visual-route.outputs.route }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/notes-preview-http.log 2>&1 &
          echo $! > /tmp/notes-preview-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:8765${NOTES_PREVIEW_ROUTE}" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notes-preview-http.log >&2
          exit 1

      - name: Validate promoted note desktop and mobile rendering
        env:
          NOTES_PREVIEW_BASE_URL: http://127.0.0.1:8765
          NOTES_PREVIEW_ROUTE: ${{ steps.visual-route.outputs.route }}
          NOTES_VISUAL_QA_OUTPUT: _notes_visual_qa
        run: node scripts/validate_notes_visual.js

      - name: Upload notes preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-publication-preview
          path: |
            _notes_publish_preview/
            _notes_source_check_preview/
            _notes_history_check/
            _notes_history_timeline_check/
            _notes_collection_index_check/
            _notes_themes_check/
            _notes_visual_qa/
          if-no-files-found: ignore
          retention-days: 7
