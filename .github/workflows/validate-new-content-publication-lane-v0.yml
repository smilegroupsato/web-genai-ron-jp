name: Validate New Content Publication Lane v0

on:
  pull_request:
    paths:
      - "content/fixtures/v2-publication-lane-test.md"
      - "requirements-publishing.txt"
      - "scripts/build_content_pages.py"
      - "scripts/build_structured_preview.py"
      - "scripts/validate_structured_preview.py"
      - ".github/workflows/validate-new-content-publication-lane-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated publishing dependency
        run: python -m pip install -r requirements-publishing.txt

      - name: Compile builders and validator
        run: |
          python -m py_compile \
            scripts/build_content_pages.py \
            scripts/build_structured_preview.py \
            scripts/validate_structured_preview.py

      - name: Generate fixture previews
        run: |
          rm -rf \
            _new_content_current_preview_ci \
            _new_content_structured_preview_ci

          python scripts/build_content_pages.py \
            --source content/fixtures/v2-publication-lane-test.md \
            --preview-root _new_content_current_preview_ci

          python scripts/build_structured_preview.py \
            --source content/fixtures/v2-publication-lane-test.md \
            --preview-root _new_content_structured_preview_ci

      - name: Validate fixture semantic parity
        run: |
          current="_new_content_current_preview_ci/fixtures/v2-publication-lane-test/index.html"
          structured="_new_content_structured_preview_ci/fixtures/v2-publication-lane-test/index.html"

          test -f "$current"
          test -f "$structured"

          python scripts/validate_structured_preview.py \
            "$current" \
            "$structured" \
            --expected-theme default-academic \
            --expected-collection core \
            --expected-base default-academic \
            --expected-season none \
            --expected-hero-variant text-only \
            --expected-text-contrast dark \
            --expected-asset-role none \
            --expected-asset-status none \
            --expected-production-enabled true

      - name: Upload fixture previews
        uses: actions/upload-artifact@v4
        with:
          name: new-content-publication-lane-v0-preview
          path: |
            _new_content_current_preview_ci/
            _new_content_structured_preview_ci/
          if-no-files-found: error
          retention-days: 7
