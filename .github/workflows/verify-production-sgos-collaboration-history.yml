# production verification only; does not deploy or modify site/
# ページ作成日時：2026-09-02 12:32 JST
# 最終更新日時：2026-09-02 15:47 JST

name: Verify SGOS collaboration history production

on:
  push:
    branches:
      - "verify-production/sgos-collaboration-history-20260902"
    paths:
      - ".github/workflows/verify-production-sgos-collaboration-history.yml"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch live production pages
        run: |
          set -euo pipefail
          article_url="https://genai-ron.jp/article/sgos-collaboration-history/"
          index_url="https://genai-ron.jp/article/"

          article_code=$(curl --location --silent --show-error --retry 5 --retry-delay 2 --output /tmp/live-article.html --write-out '%{http_code}' "$article_url")
          index_code=$(curl --location --silent --show-error --retry 5 --retry-delay 2 --output /tmp/live-index.html --write-out '%{http_code}' "$index_url")

          test "$article_code" = "200"
          test "$index_code" = "200"
          echo "article HTTP: $article_code"
          echo "index HTTP: $index_code"

      - name: Verify fixed candidate byte identity
        run: |
          set -euo pipefail
          expected="5a67f51d9d2f02794e52ffa95a6e252c8038a417ef332a26d0614c15f922539f"
          repo_sha=$(sha256sum site/article/sgos-collaboration-history/index.html | awk '{print $1}')
          live_sha=$(sha256sum /tmp/live-article.html | awk '{print $1}')
          test "$repo_sha" = "$expected"
          test "$live_sha" = "$expected"
          echo "repo SHA-256: $repo_sha"
          echo "live SHA-256: $live_sha"

      - name: Verify public content contract
        run: |
          set -euo pipefail
          page=/tmp/live-article.html
          grep -Fq 'AIと話していたら、いつの間にかOSができていた' "$page"
          grep -Fq 'ある長期対話が、書記局と運転席と統治を必要とするまで' "$page"
          grep -Fq 'SGOS' "$page"
          grep -Fq 'AIと話し続けていたら、会話のほうが、自分を続けるための仕組みを要求してきた。' "$page"
          if grep -Fq 'Smile Group OS' "$page"; then
            echo 'forbidden public name leaked: Smile Group OS' >&2
            exit 1
          fi
          if grep -Fq '更新履歴' "$page"; then
            echo 'internal update history leaked' >&2
            exit 1
          fi
          if grep -Eqi '(localhost|127\.0\.0\.1|private-user-images|api\.github\.com|raw\.githubusercontent\.com|chatgpt\.com/c/|file://|/srv/|token=|api[_-]?key=|password=)' "$page"; then
            echo 'private/local/credential-like URL or parameter pattern detected' >&2
            exit 1
          fi
          grep -Fq 'href="/article/sgos-collaboration-history/"' /tmp/live-index.html
          echo 'public content contract: OK'

      - name: Verify essential public assets
        run: |
          set -euo pipefail
          for path in /assets/theme.css /assets/theme.js /publishing/behaviors/reading-preferences-adapter.js; do
            code=$(curl --location --silent --show-error --retry 5 --retry-delay 2 --output /dev/null --write-out '%{http_code}' "https://genai-ron.jp${path}")
            test "$code" = "200"
            echo "$path HTTP: $code"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install live visual verification dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify desktop and mobile live rendering
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');

          async function verify(name, viewport) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewportSize: viewport });
            const response = await page.goto('https://genai-ron.jp/article/sgos-collaboration-history/', { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP ${response && response.status()}`);
            await page.locator('h1').filter({ hasText: 'AIと話していたら、いつの間にかOSができていた' }).waitFor({ state: 'visible' });
            const bodyText = await page.locator('body').innerText();
            if (!bodyText.includes('SGOS')) throw new Error(`${name}: SGOS missing`);
            if (bodyText.includes('Smile Group OS')) throw new Error(`${name}: forbidden public name visible`);
            if (bodyText.includes('更新履歴')) throw new Error(`${name}: update history visible`);
            const dimensions = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (dimensions.scrollWidth > dimensions.clientWidth + 2) {
              throw new Error(`${name}: horizontal overflow ${dimensions.scrollWidth} > ${dimensions.clientWidth}`);
            }
            console.log(`${name}: OK ${viewport.width}x${viewport.height}`);
            await browser.close();
          }

          (async () => {
            await verify('desktop', { width: 1440, height: 1000 });
            await verify('mobile', { width: 390, height: 844 });
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

