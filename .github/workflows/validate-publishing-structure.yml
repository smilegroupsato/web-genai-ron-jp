# 最終更新日時：2026-08-29 00:20 JST

name: Validate Publishing Structure

on:
  pull_request:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "content/**"
      - "publishing/**"
      - "site/publishing/**"
      - "requirements-publishing.txt"
      - "scripts/build_content_pages.py"
      - "scripts/build_structured_preview.py"
      - "scripts/build_promotion_fixture.py"
      - "scripts/validate_structured_preview.py"
      - "scripts/capture_structured_preview.js"
      - "scripts/validate_appearance_modes.js"
      - ".github/workflows/validate-publishing-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated publishing dependency
        run: python -m pip install -r requirements-publishing.txt

      - name: Compile builders and validator
        run: |
          python -m py_compile \
            scripts/build_content_pages.py \
            scripts/build_structured_preview.py \
            scripts/build_promotion_fixture.py \
            scripts/validate_structured_preview.py

      - name: Confirm structured builder cannot write to site
        run: |
          if python scripts/build_structured_preview.py --help | grep -q -- '--write-site'; then
            echo "structured builder unexpectedly exposes --write-site" >&2
            exit 1
          fi

      - name: Generate current and structured previews for all content pages
        run: |
          rm -rf \
            _content_build_preview_ci \
            _structured_build_preview_ci \
            _structured_library_preview_ci \
            _structured_membrane_preview_ci \
            _content_membrane_index_preview_ci \
            _structured_membrane_index_preview_ci \
            _structured_visual_qa \
            _appearance_visual_qa \
            _promotion_fixture \
            _promotion_fixture_tmp

          python scripts/build_content_pages.py \
            --preview-root _content_build_preview_ci

          python scripts/build_structured_preview.py \
            --preview-root _structured_build_preview_ci

          python scripts/build_structured_preview.py \
            --source content/series/genai-shikumi-deep-dive/04-tool-execution-loop.md \
            --preview-root _structured_library_preview_ci \
            --theme-id library-university-humanities-summer

          python scripts/build_structured_preview.py \
            --source content/series/genai-shikumi-deep-dive/04-tool-execution-loop.md \
            --preview-root _structured_membrane_preview_ci \
            --theme-id membrane-academic

          python scripts/build_content_pages.py \
            --source content/fixtures/membrane-index-layout-test.md \
            --preview-root _content_membrane_index_preview_ci

          python scripts/build_structured_preview.py \
            --source content/fixtures/membrane-index-layout-test.md \
            --preview-root _structured_membrane_index_preview_ci

      - name: Validate semantic parity for every generated page
        run: |
          count=0
          while IFS= read -r current; do
            relative="${current#_content_build_preview_ci/}"
            structured="_structured_build_preview_ci/${relative}"

            if [ ! -f "$structured" ]; then
              echo "missing structured preview: $structured" >&2
              exit 1
            fi

            python scripts/validate_structured_preview.py \
              "$current" \
              "$structured" \
              --expected-theme default-academic \
              --expected-collection core \
              --expected-base default-academic \
              --expected-season none \
              --expected-hero-variant text-only \
              --expected-text-contrast dark \
              --expected-asset-role none \
              --expected-asset-status none \
              --expected-production-enabled true

            count=$((count + 1))
          done < <(find _content_build_preview_ci -name index.html -type f | sort)

          if [ "$count" -eq 0 ]; then
            echo "no current preview pages were generated" >&2
            exit 1
          fi

          structured_count=$(find _structured_build_preview_ci -name index.html -type f | wc -l)
          if [ "$structured_count" -ne "$count" ]; then
            echo "page count mismatch: current=$count structured=$structured_count" >&2
            exit 1
          fi

          echo "validated pages: $count"

      - name: Validate Library Series metadata resolution and semantic parity
        run: |
          python scripts/validate_structured_preview.py \
            _content_build_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html \
            _structured_library_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html \
            --expected-theme library-university-humanities-summer \
            --expected-collection library-series \
            --expected-base university-humanities \
            --expected-season summer \
            --expected-hero-variant image-background \
            --expected-text-contrast dark \
            --expected-asset-role hero-main \
            --expected-asset-status unresolved \
            --expected-production-enabled false

      - name: Validate MEMBRANE metadata, stylesheet, and semantic parity
        run: |
          membrane="_structured_membrane_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html"
          python scripts/validate_structured_preview.py \
            _content_build_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html \
            "$membrane" \
            --expected-theme membrane-academic \
            --expected-collection membrane \
            --expected-base default-academic \
            --expected-season none \
            --expected-hero-variant text-only \
            --expected-text-contrast dark \
            --expected-asset-role none \
            --expected-asset-status none \
            --expected-production-enabled true

          grep -Fq '<link rel="stylesheet" href="/publishing/themes/membrane.css">' "$membrane"
          grep -Fq '<span class="series-brand-main">GENAI-RON</span>' "$membrane"
          grep -Fq '<span class="membrane-masthead-caption">Research Archive of Generative AI</span>' "$membrane"
          grep -Fq '<span class="membrane-masthead-title">MEMBRANE</span>' "$membrane"
          grep -Fq '<span class="membrane-masthead-issue">STUDIES / 01</span>' "$membrane"
          if grep -Fq 'aria-label="サイト内ナビゲーション"' "$membrane"; then
            echo "default header leaked into MEMBRANE" >&2
            exit 1
          fi
          for unpublished in thoughts research-map reading bibliography; do
            if grep -Fq "/membrane/${unpublished}/" "$membrane"; then
              echo "unpublished MEMBRANE route is linked: ${unpublished}" >&2
              exit 1
            fi
          done
          if grep -Fq '/publishing/themes/membrane.css' \
            _structured_build_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html \
            _structured_library_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/index.html; then
            echo "MEMBRANE stylesheet leaked into an existing theme" >&2
            exit 1
          fi

      - name: Validate MEMBRANE index semantic layout and parity
        run: |
          current="_content_membrane_index_preview_ci/fixtures/membrane-index-layout-test/index.html"
          structured="_structured_membrane_index_preview_ci/fixtures/membrane-index-layout-test/index.html"
          python scripts/validate_structured_preview.py \
            "$current" \
            "$structured" \
            --expected-theme membrane-academic \
            --expected-collection membrane \
            --expected-base default-academic \
            --expected-season none \
            --expected-hero-variant text-only \
            --expected-text-contrast dark \
            --expected-asset-role none \
            --expected-asset-status none \
            --expected-production-enabled true

          for region in \
            membrane-index-hero \
            membrane-index-primary-nav \
            membrane-index-information \
            membrane-index-grid \
            membrane-index-thoughts \
            membrane-index-research-map \
            membrane-index-reading \
            membrane-index-bibliography \
            membrane-index-about; do
            grep -Eq "class=\"[^\"]*${region}[^\"]*\"" "$structured"
          done

          for unpublished in thoughts research-map reading bibliography; do
            if grep -Fq "/membrane/${unpublished}/" "$structured"; then
              echo "unpublished MEMBRANE route is linked: ${unpublished}" >&2
              exit 1
            fi
          done

      - name: Build 08 promotion dry-run fixture
        run: |
          python scripts/build_promotion_fixture.py \
            --source content/series/genai-shikumi-deep-dive/08-architecture.md \
            --fixture-root _promotion_fixture \
            --tmp-root _promotion_fixture_tmp

          python scripts/validate_structured_preview.py \
            _promotion_fixture/series/genai-shikumi-deep-dive/08-architecture/current.html \
            _promotion_fixture/series/genai-shikumi-deep-dive/08-architecture/candidate.html \
            --expected-theme default-academic \
            --expected-collection core \
            --expected-base default-academic \
            --expected-season none \
            --expected-hero-variant text-only \
            --expected-text-contrast dark \
            --expected-asset-role none \
            --expected-asset-status none \
            --expected-production-enabled true

      - name: Reject unregistered theme ids
        run: |
          if python scripts/build_structured_preview.py \
            --source content/series/genai-shikumi-deep-dive/04-tool-execution-loop.md \
            --preview-root _invalid_theme_preview_ci \
            --theme-id library-not-registered; then
            echo "unregistered theme unexpectedly built" >&2
            exit 1
          fi

      - name: Validate MEMBRANE home entry semantic parity
        run: |
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          route = "/membrane/"
          markers = (
              "膜 | MEMBRANE",
              "Special Publication",
              "生命・自己・世界・AIのあいだにある「膜」を、既存研究と作業仮説を分けながら考える公開研究ノート。",
          )
          source = Path("content/index.md").read_text(encoding="utf-8")
          public = Path("site/index.html").read_text(encoding="utf-8")

          class LinkCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          parser = LinkCollector()
          parser.feed(public)
          markdown_links = re.findall(r"\[[^\]]+\]\(([^)]+)\)", source)
          assert markdown_links.count(route) == 1
          assert parser.hrefs.count(route) == 1
          for marker in markers:
              assert marker in source
              assert marker in public
          PY

      - name: Confirm only publishing bridge assets may change under site
        run: |
          disallowed=$(git diff --name-only origin/main...HEAD -- site/ ':!site/index.html' ':!site/membrane/**' ':!site/publishing/**' ':!site/series/ai-dialogue-intro/**' ':!site/notes/**' ':!site/article/index.html' ':!site/article/state-change/bibliography.html')
          if [ -n "$disallowed" ]; then
            echo "unexpected public site file changes:" >&2
            echo "$disallowed" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated visual QA dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          ln -s site/assets assets
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/genai-ron-preview-http.log 2>&1 &
          echo $! > /tmp/genai-ron-preview-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/_structured_build_preview_ci/series/genai-shikumi-deep-dive/04-tool-execution-loop/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/genai-ron-preview-http.log >&2
          exit 1

      - name: Capture desktop and mobile visual QA
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:8765
          VISUAL_QA_OUTPUT: _structured_visual_qa
        run: node scripts/capture_structured_preview.js

      - name: Validate Paper / Reading / Archive appearance modes
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:8765
          APPEARANCE_QA_OUTPUT: _appearance_visual_qa
        run: node scripts/validate_appearance_modes.js

      - name: Upload preview and visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publishing-structure-preview
          path: |
            _structured_build_preview_ci/
            _structured_library_preview_ci/
            _structured_membrane_preview_ci/
            _structured_membrane_index_preview_ci/
            _promotion_fixture/
            _structured_visual_qa/
            _appearance_visual_qa/
          if-no-files-found: error
          retention-days: 7

