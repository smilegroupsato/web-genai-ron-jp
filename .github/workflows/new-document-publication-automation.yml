name: New Document Publication Automation

on:
  pull_request:
    paths:
      - ".github/workflows/new-document-publication-automation.yml"
      - "scripts/validate_new_document_publication_pr.py"
      - "publishing/NEW_DOCUMENT_PUBLICATION.md"
      - "publishing/releases/**"
      - "site/**"
      - "data/site-routes.manifest.json"
      - "data/site-content-salvage.manifest.json"
  push:
    branches:
      - "publication-prepare/**"
      - "publication-promote/**"
    paths:
      - "publishing/requests/**"

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing dependencies
        run: python -m pip install -r requirements-publishing.txt

      - name: Compile publication automation
        run: |
          python -m py_compile \
            scripts/new_document_publication.py \
            scripts/validate_new_document_publication_pr.py

      - name: Validate two-stage publication PR
        run: python scripts/validate_new_document_publication_pr.py --base-ref origin/main

  prepare:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'publication-prepare/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover prepare request
        id: request
        shell: bash
        run: |
          mapfile -t requests < <(find publishing/requests -maxdepth 1 -type f -name '*.prepare.json' 2>/dev/null | sort)
          if [ "${#requests[@]}" -eq 0 ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#requests[@]}" -ne 1 ]; then
            echo "expected exactly one prepare request" >&2
            exit 1
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "file=${requests[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing dependencies
        if: steps.request.outputs.active == 'true'
        run: python -m pip install -r requirements-publishing.txt

      - name: Parse and validate prepare request
        if: steps.request.outputs.active == 'true'
        id: parsed
        env:
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          path = Path(os.environ["REQUEST_FILE"])
          value = json.loads(path.read_text(encoding="utf-8"))
          if set(value) != {"request_version", "id", "requested_at"}:
              raise SystemExit("prepare request has unexpected fields")
          if value["request_version"] != "0.1":
              raise SystemExit("unsupported request_version")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", str(value["id"])):
              raise SystemExit("invalid document id")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2} \d{2}:\d{2} JST", str(value["requested_at"])):
              raise SystemExit("requested_at must use YYYY-MM-DD HH:MM JST")
          print(f"id={value['id']}")
          PY

      - name: Prepare SHA-fixed production candidate
        if: steps.request.outputs.active == 'true'
        id: candidate
        env:
          DOCUMENT_ID: ${{ steps.parsed.outputs.id }}
        run: |
          rm -rf _new_document_candidate _new_document_visual_qa
          python scripts/new_document_publication.py prepare \
            --id "$DOCUMENT_ID" \
            --candidate-root _new_document_candidate \
            --receipt "publishing/releases/${DOCUMENT_ID}.json"
          python scripts/new_document_publication.py verify-receipt \
            --receipt "publishing/releases/${DOCUMENT_ID}.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          document_id = os.environ["DOCUMENT_ID"]
          receipt = json.loads(Path(f"publishing/releases/{document_id}.json").read_text(encoding="utf-8"))
          candidate = str(receipt["candidate"])
          if not candidate.endswith("index.html"):
              raise SystemExit("candidate path is not an index.html")
          print(f"sha={receipt['candidate_sha256']}")
          print(f"preview_route=/{candidate.removesuffix('index.html')}")
          PY

      - name: Set up Node
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install visual QA dependency
        if: steps.request.outputs.active == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start candidate preview server
        if: steps.request.outputs.active == 'true'
        env:
          PREVIEW_ROUTE: ${{ steps.candidate.outputs.preview_route }}
        run: |
          [ -e assets ] || ln -s site/assets assets
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/new-document-preview-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:8765${PREVIEW_ROUTE}" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/new-document-preview-http.log >&2
          exit 1

      - name: Validate desktop and mobile candidate
        if: steps.request.outputs.active == 'true'
        env:
          NEW_DOCUMENT_PREVIEW_BASE_URL: http://127.0.0.1:8765
          NEW_DOCUMENT_PREVIEW_ROUTE: ${{ steps.candidate.outputs.preview_route }}
          NEW_DOCUMENT_VISUAL_QA_OUTPUT: _new_document_visual_qa
        run: node scripts/validate_new_document_visual.js

      - name: Upload reviewed candidate bundle
        if: steps.request.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: new-document-candidate-${{ steps.parsed.outputs.id }}-${{ github.run_id }}
          path: |
            _new_document_candidate/
            publishing/releases/${{ steps.parsed.outputs.id }}.json
            _new_document_visual_qa/
          if-no-files-found: error
          retention-days: 14

      - name: Candidate SHA summary
        if: steps.request.outputs.active == 'true'
        run: |
          echo "### New document candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- id: \`${{ steps.parsed.outputs.id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate SHA-256: \`${{ steps.candidate.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'publication-promote/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover promotion request
        id: request
        shell: bash
        run: |
          mapfile -t requests < <(find publishing/requests -maxdepth 1 -type f -name '*.promote.json' 2>/dev/null | sort)
          if [ "${#requests[@]}" -eq 0 ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#requests[@]}" -ne 1 ]; then
            echo "expected exactly one promotion request" >&2
            exit 1
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "file=${requests[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing dependencies
        if: steps.request.outputs.active == 'true'
        run: python -m pip install -r requirements-publishing.txt

      - name: Parse and validate promotion request
        if: steps.request.outputs.active == 'true'
        id: parsed
        env:
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          path = Path(os.environ["REQUEST_FILE"])
          value = json.loads(path.read_text(encoding="utf-8"))
          required = {"request_version", "id", "expected_candidate_sha256", "requested_at"}
          if set(value) != required:
              raise SystemExit("promotion request has unexpected fields")
          if value["request_version"] != "0.1":
              raise SystemExit("unsupported request_version")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", str(value["id"])):
              raise SystemExit("invalid document id")
          if not re.fullmatch(r"[0-9a-f]{64}", str(value["expected_candidate_sha256"])):
              raise SystemExit("invalid expected candidate SHA-256")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2} \d{2}:\d{2} JST", str(value["requested_at"])):
              raise SystemExit("requested_at must use YYYY-MM-DD HH:MM JST")
          print(f"id={value['id']}")
          print(f"expected_sha={value['expected_candidate_sha256']}")
          PY

      - name: Regenerate and verify reviewed candidate
        if: steps.request.outputs.active == 'true'
        id: candidate
        env:
          DOCUMENT_ID: ${{ steps.parsed.outputs.id }}
          EXPECTED_SHA: ${{ steps.parsed.outputs.expected_sha }}
        run: |
          rm -rf _new_document_candidate _new_document_visual_qa
          python scripts/new_document_publication.py prepare \
            --id "$DOCUMENT_ID" \
            --candidate-root _new_document_candidate \
            --receipt "publishing/releases/${DOCUMENT_ID}.json"
          python scripts/new_document_publication.py verify-receipt \
            --receipt "publishing/releases/${DOCUMENT_ID}.json"
          actual_sha=$(python -c "import json; print(json.load(open('publishing/releases/${DOCUMENT_ID}.json'))['candidate_sha256'])")
          test "$actual_sha" = "$EXPECTED_SHA"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          document_id = os.environ["DOCUMENT_ID"]
          receipt = json.loads(Path(f"publishing/releases/{document_id}.json").read_text(encoding="utf-8"))
          candidate = str(receipt["candidate"])
          print(f"preview_route=/{candidate.removesuffix('index.html')}")
          PY

      - name: Set up Node
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install visual QA dependency
        if: steps.request.outputs.active == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start reviewed candidate server
        if: steps.request.outputs.active == 'true'
        env:
          PREVIEW_ROUTE: ${{ steps.candidate.outputs.preview_route }}
        run: |
          [ -e assets ] || ln -s site/assets assets
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/new-document-preview-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:8765${PREVIEW_ROUTE}" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/new-document-preview-http.log >&2
          exit 1

      - name: Re-run desktop and mobile QA
        if: steps.request.outputs.active == 'true'
        env:
          NEW_DOCUMENT_PREVIEW_BASE_URL: http://127.0.0.1:8765
          NEW_DOCUMENT_PREVIEW_ROUTE: ${{ steps.candidate.outputs.preview_route }}
          NEW_DOCUMENT_VISUAL_QA_OUTPUT: _new_document_visual_qa
        run: node scripts/validate_new_document_visual.js

      - name: Promote exact reviewed candidate
        if: steps.request.outputs.active == 'true'
        env:
          DOCUMENT_ID: ${{ steps.parsed.outputs.id }}
          EXPECTED_SHA: ${{ steps.parsed.outputs.expected_sha }}
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: |
          python scripts/new_document_publication.py promote \
            --receipt "publishing/releases/${DOCUMENT_ID}.json" \
            --expected-sha "$EXPECTED_SHA" \
            --write-site
          rm "$REQUEST_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote ${DOCUMENT_ID} publication candidate"

          python scripts/validate_new_document_publication_pr.py --base-ref origin/main
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Promotion branch summary
        if: steps.request.outputs.active == 'true'
        run: |
          echo "### Promotion branch prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "- id: \`${{ steps.parsed.outputs.id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reviewed SHA-256: \`${{ steps.parsed.outputs.expected_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

