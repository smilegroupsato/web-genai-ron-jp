# ページ作成日時：2026-09-02 16:59 JST
# 最終更新日時：2026-09-02 16:59 JST
# Temporary patch workflow. It modifies only scripts/validate_new_document_publication_pr.py.

name: Delegate home index from new-document validator

on:
  push:
    branches:
      - "fix/delegate-home-index-from-new-document-validator"
    paths:
      - ".github/workflows/temp-delegate-home-index-validator.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delegate-home-index-from-new-document-validator
          fetch-depth: 0

      - name: Patch validator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_new_document_publication_pr.py")
          text = path.read_text(encoding="utf-8")

          old_stamp = "最終更新日時：2026-09-02 10:57 JST"
          if old_stamp not in text:
              raise SystemExit("validator timestamp anchor missing")
          text = text.replace(old_stamp, "最終更新日時：2026-09-02 16:59 JST", 1)

          anchor = '''        if set(files) == article_index_entry:\n            print("article index publication prerequisite: OK")\n            return\n\n        gate_hint = (\n'''
          replacement = '''        if set(files) == article_index_entry:\n            print("article index publication prerequisite: OK")\n            return\n\n        home_index_entry = {\n            "content/index.md",\n            "site/index.html",\n        }\n        if set(files) == home_index_entry:\n            print("home index update detected; outside new-document publication lane")\n            return\n\n        gate_hint = (\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"home delegation anchor count: {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          history = "# 更新履歴\n"
          if history not in text:
              raise SystemExit("update history heading missing")
          entry = '# - 2026-09-02 16:59 JST：`content/index.md`＋`site/index.html` のトップページ更新をnew-document gateのscope外として委譲。\n'
          text = text.replace(history, history + entry, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/validate_new_document_publication_pr.py

      - name: Commit validator only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_new_document_publication_pr.py
          git diff --cached --check
          git commit -m "Delegate home index updates from new-document validator"
          git push origin HEAD:fix/delegate-home-index-from-new-document-validator
