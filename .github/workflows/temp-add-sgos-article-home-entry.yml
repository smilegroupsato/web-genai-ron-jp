# ページ作成日時：2026-09-02 16:59 JST
# 最終更新日時：2026-09-02 16:59 JST
# Temporary patch workflow. It modifies only content/index.md and site/index.html.

name: Add SGOS history home entry

on:
  push:
    branches:
      - "feat/sgos-history-home-entry"
    paths:
      - ".github/workflows/temp-add-sgos-article-home-entry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sgos-history-home-entry
          fetch-depth: 0

      - name: Add article 3 to home source and public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          content = Path("content/index.md")
          site = Path("site/index.html")
          md = content.read_text(encoding="utf-8")
          html = site.read_text(encoding="utf-8")

          md_anchor = '''### [理解・防御壁・行動](article/understanding-defense-action/)\n\nAIとの対話によって速く生じた理解が、なぜそのまま行動や現実の変化にならないのかを考える。\n\nArticle / 長篇論考 / 2026 / Understanding, Defense, Action\n\n- [PDF](downloads/genai-ron_02_understanding-defense-action_2026-05-20.pdf)\n'''
          md_insert = md_anchor + '''\n### [AIと話していたら、いつの間にかOSができていた](/article/sgos-collaboration-history/)\n\nChatGPTエクスポートを一次資料として、仕事・生活・研究・創作が混ざる長期対話からSGOSという協働系が生まれた過程をたどる。\n\nArticle / 論考 / 2026 / SGOS, Human-AI Collaboration, History\n'''
          if md.count(md_anchor) != 1:
              raise SystemExit(f"content/index.md article-2 anchor count: {md.count(md_anchor)}")
          if "/article/sgos-collaboration-history/" in md:
              raise SystemExit("content/index.md already contains SGOS article route")
          md = md.replace(md_anchor, md_insert, 1)

          html_anchor = '''        <li class="index-item">\n          <a class="index-title" href="article/understanding-defense-action/">理解・防御壁・行動</a>\n          <p class="index-caption">AIとの対話によって速く生じた理解が、なぜそのまま行動や現実の変化にならないのかを考える。</p>\n          <p class="index-meta">Article / 長篇論考 / 2026 / Understanding, Defense, Action</p>\n          <p class="index-links"><a href="downloads/genai-ron_02_understanding-defense-action_2026-05-20.pdf">PDF</a></p>\n        </li>\n'''
          html_insert = html_anchor + '''        <li class="index-item">\n          <a class="index-title" href="/article/sgos-collaboration-history/">AIと話していたら、いつの間にかOSができていた</a>\n          <p class="index-caption">ChatGPTエクスポートを一次資料として、仕事・生活・研究・創作が混ざる長期対話からSGOSという協働系が生まれた過程をたどる。</p>\n          <p class="index-meta">Article / 論考 / 2026 / SGOS, Human-AI Collaboration, History</p>\n        </li>\n'''
          if html.count(html_anchor) != 1:
              raise SystemExit(f"site/index.html article-2 anchor count: {html.count(html_anchor)}")
          if "/article/sgos-collaboration-history/" in html:
              raise SystemExit("site/index.html already contains SGOS article route")
          html = html.replace(html_anchor, html_insert, 1)
          site.write_text(html, encoding="utf-8")

          site_sha = hashlib.sha256(site.read_bytes()).hexdigest()
          md = re.sub(
              r'(?m)^source_html_sha256: "[0-9a-f]{64}"$',
              f'source_html_sha256: "{site_sha}"',
              md,
              count=1,
          )
          content.write_text(md, encoding="utf-8")

          assert md.count("/article/sgos-collaboration-history/") == 1
          assert html.count("/article/sgos-collaboration-history/") == 1
          assert "AIと話していたら、いつの間にかOSができていた" in md
          assert "AIと話していたら、いつの間にかOSができていた" in html
          print("home entry added; site SHA-256:", site_sha)
          PY

      - name: Commit home entry files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/index.md site/index.html
          git diff --cached --check
          git commit -m "Add SGOS collaboration history to home"
          git push origin HEAD:feat/sgos-history-home-entry
