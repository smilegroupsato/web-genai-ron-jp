name: Diagnose production route split

on:
  push:
    branches:
      - "diagnose/production-route-split-20260902"
    paths:
      - ".github/workflows/diagnose-production-route-split.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS records
        run: |
          set -u
          echo '=== system resolver ==='
          getent ahosts genai-ron.jp || true
          getent ahosts www.genai-ron.jp || true
          echo '=== authoritative/public A/AAAA/CNAME ==='
          for resolver in '' '@1.1.1.1' '@8.8.8.8'; do
            echo "--- resolver: ${resolver:-system} ---"
            dig +short $resolver A genai-ron.jp || true
            dig +short $resolver AAAA genai-ron.jp || true
            dig +short $resolver A www.genai-ron.jp || true
            dig +short $resolver AAAA www.genai-ron.jp || true
            dig +short $resolver CNAME www.genai-ron.jp || true
          done

      - name: HTTPS route matrix
        run: |
          set -u
          expected='5a67f51d9d2f02794e52ffa95a6e252c8038a417ef332a26d0614c15f922539f'
          urls=(
            'https://genai-ron.jp/article/sgos-collaboration-history/'
            'https://genai-ron.jp/article/sgos-collaboration-history/index.html'
            'https://www.genai-ron.jp/article/sgos-collaboration-history/'
            'https://www.genai-ron.jp/article/sgos-collaboration-history/index.html'
          )
          for family in 4 6; do
            echo "=== IPv${family} ==="
            for url in "${urls[@]}"; do
              echo "--- $url ---"
              out="/tmp/body-${family}-$(echo "$url" | tr '/:.' '_')"
              if curl -${family} --location --silent --show-error --connect-timeout 10 --max-time 25 \
                    -o "$out" -w 'code=%{http_code} remote_ip=%{remote_ip} url_effective=%{url_effective} content_type=%{content_type}\n' "$url"; then
                if [ -f "$out" ]; then
                  sha=$(sha256sum "$out" | awk '{print $1}')
                  bytes=$(wc -c < "$out")
                  echo "sha256=$sha bytes=$bytes expected_match=$([ "$sha" = "$expected" ] && echo yes || echo no)"
                  grep -F 'AIと話していたら、いつの間にかOSができていた' "$out" | head -1 || true
                fi
              else
                echo 'curl failed'
              fi
            done
          done

      - name: Article index and cache variants
        run: |
          set -u
          route='https://genai-ron.jp/article/sgos-collaboration-history/'
          index='https://genai-ron.jp/article/'
          stamp='202609021702'

          echo '=== live article index ==='
          curl -4 -sSL --connect-timeout 10 --max-time 25 -D /tmp/index.headers -o /tmp/index.html "$index"
          cat /tmp/index.headers
          grep -F 'href="/article/sgos-collaboration-history/"' /tmp/index.html || echo 'ARTICLE LINK NOT FOUND IN INDEX'
          grep -F 'AIと話していたら、いつの間にかOSができていた' /tmp/index.html || true

          echo '=== article default ==='
          curl -4 -sSL --connect-timeout 10 --max-time 25 -D /tmp/article-default.headers -o /tmp/article-default.html "$route"
          cat /tmp/article-default.headers
          sha256sum /tmp/article-default.html

          echo '=== article Cache-Control:no-cache ==='
          curl -4 -sSL --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -D /tmp/article-nocache.headers -o /tmp/article-nocache.html "$route"
          cat /tmp/article-nocache.headers
          sha256sum /tmp/article-nocache.html

          echo '=== article cache-busting query ==='
          curl -4 -sSL --connect-timeout 10 --max-time 25 -D /tmp/article-cb.headers -o /tmp/article-cb.html "${route}?cb=${stamp}"
          cat /tmp/article-cb.headers
          sha256sum /tmp/article-cb.html

      - name: Response headers and TLS
        run: |
          set -u
          for host in genai-ron.jp www.genai-ron.jp; do
            echo "=== HEAD $host ==="
            curl -4 -sSIL --connect-timeout 10 --max-time 20 "https://${host}/article/sgos-collaboration-history/" || true
            echo "=== TLS $host ==="
            timeout 15 openssl s_client -connect "${host}:443" -servername "$host" </dev/null 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          done
