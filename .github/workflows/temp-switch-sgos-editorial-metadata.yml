# ページ作成日時：2026-09-02 18:11 JST
# 最終更新日時：2026-09-02 18:11 JST
name: Switch SGOS editorial metadata

on:
  push:
    branches:
      - "fix/sgos-article-editorial-metadata"
    paths:
      - ".github/workflows/temp-switch-sgos-editorial-metadata.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sgos-article-editorial-metadata
          fetch-depth: 0

      - name: Patch presentation metadata only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("content/article/sgos-collaboration-history/index.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ('series_order: ""', 'series_order: "03"'),
              ('order_display: ""', 'order_display: "03"'),
              ('theme_id: "default-academic"', 'theme_id: "editorial-article"'),
              ('last_updated_at: "2026-09-02 10:45 JST"', 'last_updated_at: "2026-09-02 18:11 JST"'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one metadata anchor: {old!r} count={text.count(old)}")
              text = text.replace(old, new, 1)

          history = "## 更新履歴\n"
          if history not in text:
              raise SystemExit("update history heading missing")
          text = text.replace(
              history,
              history + "\n- 2026-09-02 18:11 JST：公開本文は変更せず、論考③を長篇論考用 `editorial-article` theme / Article 03 表示へ切替。\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- content/article/sgos-collaboration-history/index.md

      - name: Verify body text unchanged apart from metadata history
        run: |
          python -m pip install -r requirements-publishing.txt
          rm -rf _structured_build_preview
          python scripts/build_structured_preview.py --source content/article/sgos-collaboration-history/index.md
          page=_structured_build_preview/article/sgos-collaboration-history/index.html
          grep -Fq 'data-theme-id="editorial-article"' "$page"
          grep -Fq 'GENAI-RON Article 03' "$page"
          grep -Fq '>論考一覧<' "$page"
          ! grep -Fq '>超詳解トップ<' "$page"
          ! grep -Fq '>一般向け版<' "$page"
          ! grep -Fq '>詳解版<' "$page"
          ! grep -Fq '<h2>更新履歴</h2>' "$page"
          ! grep -Fq 'Smile Group OS' "$page"
          grep -Fq 'SGOS' "$page"
          echo 'SGOS editorial metadata preview: OK'

      - name: Commit source metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/article/sgos-collaboration-history/index.md
          git diff --cached --check
          git commit -m "Switch SGOS article to editorial presentation metadata"
          git push origin HEAD:fix/sgos-article-editorial-metadata
