name: Apply public body exclusion renderer fix

on:
  push:
    branches:
      - "fix/honor-public-body-exclusions"
    paths:
      - ".github/workflows/temp-apply-public-body-exclusion-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/honor-public-body-exclusions
          fetch-depth: 0

      - name: Patch publication builders
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one patch point in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/build_content_pages.py",
              "\ndef render_inline(text: str) -> str:\n",
              '''\ndef filter_public_body(meta: Dict[str, object], markdown: str) -> str:\n    raw = meta.get("exclude_from_public_body", [])\n    if raw in (None, ""):\n        return markdown\n    if not isinstance(raw, list):\n        raise BuildError("exclude_from_public_body must be a list of H2 headings")\n\n    excluded = {str(value).strip() for value in raw if str(value).strip()}\n    if not excluded:\n        return markdown\n\n    output: List[str] = []\n    skipping = False\n    for line in markdown.splitlines(keepends=True):\n        match = re.match(r"^##\\s+(.+?)\\s*$", line.rstrip("\\r\\n"))\n        if match:\n            skipping = match.group(1).strip() in excluded\n        if not skipping:\n            output.append(line)\n    return "".join(output)\n\n\ndef render_inline(text: str) -> str:\n''',
          )
          replace_once(
              "scripts/build_content_pages.py",
              "    body_html = render_markdown_body(body)\n    page = build_article_html(meta, body_html)\n",
              "    public_body = filter_public_body(meta, body)\n    body_html = render_markdown_body(public_body)\n    page = build_article_html(meta, body_html)\n",
          )

          replace_once(
              "scripts/build_structured_preview.py",
              "    parse_front_matter,\n    render_article_nav,\n    render_markdown_body,\n",
              "    filter_public_body,\n    parse_front_matter,\n    render_article_nav,\n    render_markdown_body,\n",
          )
          replace_once(
              "scripts/build_structured_preview.py",
              "    body_html = render_markdown_body(body)\n    page = build_article(meta, body, body_html, theme_id)\n",
              "    public_body = filter_public_body(meta, body)\n    body_html = render_markdown_body(public_body)\n    page = build_article(meta, public_body, body_html, theme_id)\n",
          )
          PY

      - name: Verify exclusion behavior before commit
        run: |
          python -m py_compile scripts/build_content_pages.py scripts/build_structured_preview.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from build_content_pages import filter_public_body, render_markdown_body

          markdown = "Visible intro.\n\n## 更新履歴\ninternal history\n\n## 公開節\nvisible ending\n"
          filtered = filter_public_body({"exclude_from_public_body": ["更新履歴"]}, markdown)
          assert "Visible intro." in filtered
          assert "更新履歴" not in filtered
          assert "internal history" not in filtered
          assert "## 公開節" in filtered
          assert "visible ending" in filtered
          rendered = render_markdown_body(filtered)
          assert "<h2>更新履歴</h2>" not in rendered
          assert "<h2>公開節</h2>" in rendered
          print("public body exclusion metadata: OK")
          PY
          rm -rf /tmp/sgos-public-preview
          python scripts/build_structured_preview.py \
            --source content/article/sgos-collaboration-history/index.md \
            --preview-root /tmp/sgos-public-preview
          test -f /tmp/sgos-public-preview/article/sgos-collaboration-history/index.html
          ! grep -Fq '<h2>更新履歴</h2>' /tmp/sgos-public-preview/article/sgos-collaboration-history/index.html
          ! grep -Fq 'Smile Group OS' /tmp/sgos-public-preview/article/sgos-collaboration-history/index.html
          grep -Fq 'AIと話していたら、いつの間かOSができていた' /tmp/sgos-public-preview/article/sgos-collaboration-history/index.html || \
          grep -Fq 'AIと話していたら、いつの間にかOSができていた' /tmp/sgos-public-preview/article/sgos-collaboration-history/index.html

      - name: Commit builder changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_content_pages.py scripts/build_structured_preview.py
          git commit -m "Honor exclude_from_public_body in publication builders"
          git push origin HEAD:fix/honor-public-body-exclusions
