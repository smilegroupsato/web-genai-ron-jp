# ページ作成日時：2026-09-02 16:59 JST
# 最終更新日時：2026-09-02 16:59 JST
name: Wire SGOS editorial theme

on:
  push:
    branches:
      - "fix/sgos-article-editorial-theme"
    paths:
      - ".github/workflows/temp-wire-sgos-editorial-theme.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sgos-article-editorial-theme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch theme registry, builder, and article metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one patch point in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Register theme.
          replace_once(
              "publishing/site.yml",
              "# 最終更新日時：2026-07-23 08:43 JST",
              "# 最終更新日時：2026-09-02 16:59 JST",
          )
          replace_once(
              "publishing/site.yml",
              "  membrane-academic:\n    manifest: publishing/themes/membrane.yml\n  library-series:\n",
              "  membrane-academic:\n    manifest: publishing/themes/membrane.yml\n  editorial-article:\n    manifest: publishing/themes/editorial-article.yml\n  library-series:\n",
          )
          replace_once(
              "publishing/site.yml",
              "update_history:\n",
              "update_history:\n  - 2026-09-02 16:59 JST: 長篇論考向け editorial-article theme を登録。\n",
          )

          # Dedicated header for editorial article collection.
          replace_once(
              "scripts/build_structured_preview.py",
              'MEMBRANE_HEADER = PUBLISHING_ROOT / "components" / "membrane-header.html"\n',
              'MEMBRANE_HEADER = PUBLISHING_ROOT / "components" / "membrane-header.html"\nEDITORIAL_ARTICLE_HEADER = PUBLISHING_ROOT / "components" / "editorial-article-header.html"\n',
          )
          replace_once(
              "scripts/build_structured_preview.py",
              '''def render_site_header(series_slug: str, theme: Dict[str, str]) -> str:\n    if theme["theme_id"] == "membrane-academic" or theme["theme_collection"] == "membrane":\n        return read_required(MEMBRANE_HEADER)\n''',
              '''def render_site_header(series_slug: str, theme: Dict[str, str]) -> str:\n    if theme["theme_id"] == "membrane-academic" or theme["theme_collection"] == "membrane":\n        return read_required(MEMBRANE_HEADER)\n    if theme["theme_id"] == "editorial-article" or theme["theme_collection"] == "editorial-article":\n        return read_required(EDITORIAL_ARTICLE_HEADER)\n''',
          )

          # Switch only presentation metadata; body text remains untouched.
          replace_once(
              "content/article/sgos-collaboration-history/index.md",
              'series_order: ""\norder_display: ""\n',
              'series_order: "03"\norder_display: "03"\n',
          )
          replace_once(
              "content/article/sgos-collaboration-history/index.md",
              'theme_id: "default-academic"',
              'theme_id: "editorial-article"',
          )
          replace_once(
              "content/article/sgos-collaboration-history/index.md",
              'last_updated_at: "2026-09-02 10:45 JST"',
              'last_updated_at: "2026-09-02 16:59 JST"',
          )
          PY

      - name: Verify structured preview
        run: |
          python -m pip install -r requirements-publishing.txt
          python -m py_compile scripts/build_structured_preview.py
          rm -rf _structured_build_preview
          python scripts/build_structured_preview.py --source content/article/sgos-collaboration-history/index.md
          page=_structured_build_preview/article/sgos-collaboration-history/index.html
          test -f "$page"
          grep -Fq 'data-theme-id="editorial-article"' "$page"
          grep -Fq '/publishing/design/editorial-article.css' "$page"
          grep -Fq 'Research Archive of Generative AI' "$page"
          grep -Fq '>論考一覧<' "$page"
          ! grep -Fq '>超詳解トップ<' "$page"
          ! grep -Fq '>一般向け版<' "$page"
          ! grep -Fq '>詳解版<' "$page"
          grep -Fq 'GENAI-RON Article 03' "$page"
          echo 'editorial article preview: OK'

      - name: Commit wiring only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publishing/site.yml scripts/build_structured_preview.py content/article/sgos-collaboration-history/index.md
          git diff --cached --check
          git commit -m "Wire SGOS article to editorial theme"
          git push origin HEAD:fix/sgos-article-editorial-theme
